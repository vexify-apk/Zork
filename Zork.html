<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
<title>Zork 2 - Parchment</title>
<style>
  :root{
    --paper:#000000;
    --paper-edge:#000000;
    --ink:#ffffff;
    --ink-soft:#ffffff;
    --rule:#ffffff;
    --accent:#0ccad8c9;
  }
  html,body{
    height:100%;
    margin:0;
    background:#000000;
    background-image:
      radial-gradient(ellipse at top, #000000 0%, #000000 60%, #000000 100%);
    font-family:Georgia,'Times New Roman',serif;
    color:var(--ink);
  }
  #page{
    max-width:900px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    box-shadow:0 0 40px rgba(0,0,0,0.25);
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--paper-edge);
    border-right:1px solid var(--paper-edge);
  }
  header{
    padding:18px 28px 10px 28px;
    border-bottom:1px solid var(--rule);
  }
  header h1{
    font-size:1.4em;
    margin:0;
    font-weight:normal;
    letter-spacing:0.04em;
    color:var(--ink);
  }
  header .byline{
    font-size:0.78em;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:2px;
  }
  #output{
    flex:1;
    padding:20px 28px 30px 28px;
    font-size:1em;
    line-height:1;
    overflow-y:auto;
    white-space:pre-wrap;
  }
  #output p{
    margin:0 0 0.85em 0;
  }
  #output p.cmdline{
    color:var(--accent);
    font-weight:bold;
  }
  #output p.sys{
    color:var(--ink-soft);
    font-style:italic;
  }
  .input-row{
    display:flex;
    align-items:baseline;
    margin:0 0 0.85em 0;
  }
  .prompt-inline{
    font-weight:bold;
    margin-right:6px;
    color:var(--accent);
    font-size:1.05em;
    flex-shrink:0;
  }
  .cmd-input-inline{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.05em;
    color:var(--ink);
    caret-color:var(--accent);
    padding:0;
    margin:0;
  }
  #footer{
    text-align:center;
    font-size:0.72em;
    color:var(--ink-soft);
    padding:6px 0 14px 0;
    border-top:1px solid var(--rule);
  }
  ::selection{ background:#d6cba5; color:#000; }
  @media (max-width:600px){
    header, #output, #footer{ padding-left:16px; padding-right:16px; }
  }
</style>
</head>

(function(){
"use strict";

const outputEl = document.getElementById('output');

function scrollDown(){
  outputEl.scrollTop = outputEl.scrollHeight;
}

function printRaw(text, cls){
  const lines = String(text).split("\n");
  for(const line of lines){
    const p = document.createElement('p');
    if(cls) p.className = cls;
    p.textContent = line.length ? line : "\u00A0";
    outputEl.appendChild(p);
  }
  scrollDown();
}

function print(...parts){
  printRaw(parts.join(""));
}

function sys(text){
  printRaw(text, 'sys');
}

async function sleep(ms){
  return new Promise(r=>setTimeout(r, ms));
}

async function typewriter(text, delay=60){
  const p = document.createElement('p');
  outputEl.appendChild(p);
  let buffer = "";
  for(const ch of text){
    buffer += ch;
    p.textContent = buffer;
    scrollDown();
    if(ch === ":"){
      await sleep(260);
    } else {
      await sleep(delay);
    }
  }
}

function waitForInput(){
  return new Promise(resolve=>{
    const row = document.createElement('div');
    row.className = 'input-row';

    const promptSpan = document.createElement('span');
    promptSpan.className = 'prompt-inline';
    print()
    promptSpan.textContent = '>';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'cmd-input-inline';
    inp.autocomplete = 'off';
    inp.autocapitalize = 'off';
    inp.spellcheck = false;

    row.appendChild(promptSpan);
    row.appendChild(inp);
    outputEl.appendChild(row);
    scrollDown();
    inp.focus();

    function commit(){
      const val = inp.value;
      inp.removeEventListener('keydown', onKey);
      row.remove();
      const p = document.createElement('p');
      p.className = 'cmdline';
      p.textContent = '> ' + val;
      outputEl.appendChild(p);
      scrollDown();
      resolve(val);
    }

    function onKey(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        commit();
      }
    }
    inp.addEventListener('keydown', onKey);

    inp.addEventListener('blur', ()=>{
      setTimeout(()=>{ if(document.body.contains(inp)) inp.focus(); }, 0);
    });
  });
}

async function input(promptText){
  if(promptText) printRaw(promptText);
  const v = await waitForInput();
  return v;
}

async function dotCycle(label){
  const p = document.createElement('p');
  outputEl.appendChild(p);
  const frames = [".  ", ".. ", "..."];
  for(let i=0;i<6;i++){
    p.textContent = label + frames[i % 3];
    scrollDown();
    await sleep(320);
  }
  outputEl.removeChild(p);
}

function checkForTrap(r,c){
  const pos = key(r,c);
  const trap = Traps[pos];
  if(!trap) return false;
  if(trap.one_time && trap.triggered) return false;
  trap.triggered = true;
  PlayerHealth -= trap.damage;
  print(trap.description);
  print(`You took ${trap.damage} damage`);
  print(`Health remaining: ${PlayerHealth} health`);
  if(PlayerHealth <= 0){
    print("The trap was fatal...");
    PlayerHealth = 0;
  }
  return true;
}

function getRoomDescription(r,c){
  const pos = key(r,c);
  if(pos in RoomDescriptions) return RoomDescriptions[pos];
  return "A nondescript part of the maze.";
}

function getAdjacentNPCs(r,c){
  const found = [];
  if(key(r,c) in NPCs) found.push(["next", r, c]);
  if(r > 0 && key(r-1,c) in NPCs) found.push(["north", r-1, c]);
  if(r < Maze.length-1 && key(r+1,c) in NPCs) found.push(["south", r+1, c]);
  if(c < Maze[0].length-1 && key(r,c+1) in NPCs) found.push(["east", r, c+1]);
  if(c > 0 && key(r,c-1) in NPCs) found.push(["west", r, c-1]);
  return found;
}

function getAdjacentEnemies(r,c){
  const found = [];
  if(key(r,c) in enemies) found.push(["next", r, c]);
  if(r > 0 && key(r-1,c) in enemies) found.push(["north", r-1, c]);
  if(r < Maze.length-1 && key(r+1,c) in enemies) found.push(["south", r+1, c]);
  if(c < Maze[0].length-1 && key(r,c+1) in enemies) found.push(["east", r, c+1]);
  if(c > 0 && key(r,c-1) in enemies) found.push(["west", r, c-1]);
  return found;
}

function getAdjacentDoors(r,c){
  const adj = [];
  if(r > 0 && Maze[r-1][c] === 9) adj.push(["north", r-1, c]);
  if(r < Maze.length-1 && Maze[r+1][c] === 9) adj.push(["south", r+1, c]);
  if(c < Maze[0].length-1 && Maze[r][c+1] === 9) adj.push(["east", r, c+1]);
  if(c > 0 && Maze[r][c-1] === 9) adj.push(["west", r, c-1]);
  return adj;
}

async function handleBuying(s){
  print("--- Items for Sale ---");
  const itemsList = Object.entries(s.inventory);
  itemsList.forEach(([item, price], i)=>{
    const desc = Items[item].description.split("|")[0].trim();
    print(`${i+1}. ${item} - ${price} coins - ${desc}`);
  });
  print(`${itemsList.length+1}. Cancel`);

  const raw = await input("What would you like to buy? (number): ");
  const choice = parseInt(raw, 10);
  if(isNaN(choice)){ print("Please enter a number!"); return; }
  if(choice >= 1 && choice <= itemsList.length){
    const [item, price] = itemsList[choice-1];
    const coinCount = PlayerInventory.filter(i=>i==="coin").length;
    if(coinCount >= price){
      for(let i=0;i<price;i++){
        const idx = PlayerInventory.indexOf("coin");
        PlayerInventory.splice(idx,1);
      }
      PlayerInventory.push(item);
      print(`You bought ${item} for ${price} coins!`);
    } else {
      print(`Not enough coins! You need ${price} coins, but you have ${coinCount}.`);
    }
  } else if(choice === itemsList.length+1){
    print("Maybe next time!");
  } else {
    print("Invalid choice!");
  }
}

async function handleSelling(s){
  if(PlayerInventory.length === 0){
    print("You have nothing to sell!");
    return;
  }
  const uniq = [...new Set(PlayerInventory)];
  const sellable = [];
  for(const item of uniq){
    if(item in s.buy_prices){
      const count = PlayerInventory.filter(i=>i===item).length;
      sellable.push([item, count, s.buy_prices[item]]);
    }
  }
  if(sellable.length === 0){
    print("The shopkeeper isn't interested in your items!");
    return;
  }
  print("--- Items to Sell ---");
  sellable.forEach(([item,count,price], i)=>{
    print(`${i+1}. ${item} (x${count}) - ${price} coins each`);
  });
  print(`${sellable.length+1}. Cancel`);

  const raw = await input("What would you like to sell? (number): ");
  const choice = parseInt(raw, 10);
  if(isNaN(choice)){ print("Please enter a number!"); return; }
  if(choice >= 1 && choice <= sellable.length){
    const [item, count, price] = sellable[choice-1];
    let amount = 1;
    if(count > 1){
      const amtRaw = await input(`How many ${item}s? (1-${count}): `);
      amount = parseInt(amtRaw, 10);
      if(isNaN(amount) || amount < 1 || amount > count){
        print("Invalid amount!");
        return;
      }
    }
    for(let i=0;i<amount;i++){
      const idx = PlayerInventory.indexOf(item);
      PlayerInventory.splice(idx,1);
    }
    for(let i=0;i<price*amount;i++){
      PlayerInventory.push("coin");
    }
    print(`Sold ${amount}x ${item} for ${price*amount} coins!`);
  } else if(choice === sellable.length+1){
    print("Maybe next time!");
  } else {
    print("Invalid choice!");
  }
}

async function handleShopInteraction(s){
  print(`${s.name}: "${s.greeting}"`);
  while(true){
    print(`${"=".repeat(50)}`);
    print(`Your coins: ${PlayerInventory.filter(i=>i==="coin").length}`);
    print(`Your health: ${PlayerHealth}`);
    print(`1. Buy items`);
    print(`2. Sell items`);
    print(`3. Leave shop`);
    const choice = (await input("What would you like to do? ")).toLowerCase().trim();
    if(choice === "1" || choice === "buy"){
      await handleBuying(s);
    } else if(choice === "2" || choice === "sell"){
      await handleSelling(s);
    } else if(choice === "3" || choice === "leave" || choice === "exit"){
      print(`${s.name}: "Safe travels!"`);
      break;
    } else {
      print("Invalid choice!");
    }
  }
}

function randint(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

async function handleEnemyInteraction(enemy, enemyRow, enemyCol){
  if(enemy.dead){
    print(`There is a slayed ${enemy.name} on the ground`);
    return;
  }

  print(`${"=".repeat(50)}`);
  await typewriter(`You engage the ${enemy.name} in combat!`);
  print(`${"=".repeat(50)}`);
  await sleep(2000);

  let playerDamage = 5;
  let weaponUsed = "fists";

  if(PlayerInventory.includes("mace")){ playerDamage = randint(20,30); weaponUsed = "mace"; }
  else if(PlayerInventory.includes("sword")){ playerDamage = randint(15,25); weaponUsed = "sword"; }
  else if(PlayerInventory.includes("spear")){ playerDamage = randint(12,20); weaponUsed = "spear"; }
  else if(PlayerInventory.includes("rusty dagger")){ playerDamage = randint(8,15); weaponUsed = "rusty dagger"; }
  else if(PlayerInventory.includes("rock")){ playerDamage = randint(5,10); weaponUsed = "rock"; }

  const enemyStatsTable = {
    "Minotaur":{health:80, damage:[20,35]},
    "Troll":{health:60, damage:[12,25]},
    "Brute":{health:50, damage:[10,20]},
    "Goblin":{health:35, damage:[8,15]},
    "Skeleton":{health:30, damage:[5,12]},
    "Giant Rat":{health:20, damage:[3,8]}
  };
  const stats = enemyStatsTable[enemy.name] || {health:25, damage:[5,15]};
  let enemyHealth = stats.health;
  const [enemyMinDamage, enemyMaxDamage] = stats.damage;

  let williamBonus = 0;
  if(prisonerDialogueDone2){
    williamBonus = randint(3,8);
    williamBonus = Math.round(williamBonus * williamMulti);
    print("William fights alongside you!");
    await sleep(500);
  }

  print(`${enemy.name} Health: ${enemyHealth}`);
  print(`Your Health: ${PlayerHealth}`);
  print(`Your Weapon: ${weaponUsed} (Damage: ${playerDamage})`);
  if(prisonerDialogueDone2) print(`William's Bonus: +${williamBonus} damage`);
  await sleep(2000)
  let turn = 1;
  while(enemyHealth > 0 && PlayerHealth > 0){
    print(`--- Turn ${turn} ---`);
    await sleep(2000);

    const totalDamage = playerDamage + williamBonus;
    enemyHealth -= totalDamage;
    print(`Your ${weaponUsed} deals ${totalDamage} damage!`);

    if(enemyHealth <= 0){
      enemyHealth = 0;
      print(`The ${enemy.name} has been defeated!`);
      await sleep(2000);
      break;
    }

    print(`${enemy.name} Health: ${enemyHealth}`);
    await sleep(2000);

    const enemyDamage = randint(enemyMinDamage, enemyMaxDamage);
    print(`The ${enemy.name} attacks you for ${enemyDamage} damage!`);
    PlayerHealth -= enemyDamage;
    print(`Your Health: ${PlayerHealth}`);

    if(PlayerHealth <= 20 && PlayerHealth > 0){
      print("Your health is low!");
    } else if(PlayerHealth <= 50 && PlayerHealth > 20){
      print("You're taking heavy damage!");
    }

    if(PlayerHealth <= 0){
      PlayerHealth = 0;
      print(`The ${enemy.name} has defeated you!`);
      print("Your vision fades to black...");
      await sleep(3000);
      return;
    }

    await sleep(500);
    turn += 1;

    if(turn % 3 === 0 && enemyHealth > 0 && PlayerHealth > 0){
      print(`${"=".repeat(50)}`);
      print("What do you want to do?");
      print("1. Continue fighting");
      print("2. Use healing item");
      print("3. Try to flee");
      const choice = (await input("")).trim();

      if(choice === "2"){
        const healAmounts = {bread:30, bandage:50, cheese:20, gruel:10};
        const healingItems = PlayerInventory.filter(i=>["bread","bandage","cheese","gruel"].includes(i));
        if(healingItems.length){
          print("Healing items:");
          healingItems.forEach((item,i)=>{ print(`${i+1}. ${item}`); });
          print(`${healingItems.length+1}. Cancel`);
          const raw = await input("");
          const pick = parseInt(raw, 10);
          if(!isNaN(pick) && pick >= 1 && pick <= healingItems.length){
            const item = healingItems[pick-1];
            const heal = healAmounts[item];
            PlayerHealth = Math.min(100, PlayerHealth + heal);
            const idx = PlayerInventory.indexOf(item);
            PlayerInventory.splice(idx,1);
            print(`You use ${item} and restore ${heal} health!`);
            print(`Health: ${PlayerHealth}`);
          } else if(pick === healingItems.length+1){
            print("You decide to save your items.");
          } else {
            print("Invalid choice!");
          }
        } else {
          print("You have no healing items!");
        }
      } else if(choice === "3"){
        print(`You successfully flee from the ${enemy.name}!`);
        await sleep(2000);
        return;
      }
    }
  }

  if(enemyHealth <= 0){
    print(`${"=".repeat(50)}`);
    await typewriter(`Victory! The ${enemy.name} has been slain!`);
    print(`${"=".repeat(50)}`);

    enemy.dead = true;
    enemy.name = `Dead ${enemy.name}`;
    Maze[enemyRow][enemyCol] = 0;

    if(enemy.loot && enemy.loot.length){
      const pos = key(enemyRow, enemyCol);
      if(!(pos in RoomItems)) RoomItems[pos] = [];
      RoomItems[pos].push(...enemy.loot);
      print(`The ${enemy.name} dropped: ${enemy.loot.join(", ")}`);
    }

    row = enemyRow;
    col = enemyCol;
    PlayerPos = [row, col];

    await sleep(3000);
  }
}

async function tryMove(dr, dc){
  const targetRow = row + dr;
  const targetCol = col + dc;
  
  if(targetRow < 0 || targetRow >= Maze.length || targetCol < 0 || targetCol >= Maze[0].length){
    print("You cannot exit the maze this way");
    return;
  }
  
  const targetVal = Maze[targetRow][targetCol];

  if(targetVal === 8){
    const npcPos = key(targetRow, targetCol);
    if(npcPos in NPCs && !NPCs[npcPos].solved){
      print(`${NPCs[npcPos].name} blocks your path!`);
      print(`"${NPCs[npcPos].dialogue_before}"`);
      return;
    } else {
      row = targetRow; col = targetCol;
      PlayerPos = [row,col];
      VisitedRooms.add(key(row,col));
      await afterMoveReport(row,col);
      return;
    }
  }

  if(targetVal === 5){
    const enemyPos = key(targetRow, targetCol);
    if(enemyPos in enemies && !enemies[enemyPos].dead){
      print(`${enemies[enemyPos].name} blocks your path!`);
      print(`${enemies[enemyPos].requirement}`);
      return;
    } else {
      row = targetRow; col = targetCol;
      PlayerPos = [row,col];
      VisitedRooms.add(key(row,col));
      await afterMoveReport(row,col);
      return;
    }
  }

  if(targetVal !== 1){
    if(targetVal === 9){
      const doorPos = key(targetRow, targetCol);
      if(doorPos in Doors && Doors[doorPos].locked){
        print(`The door is locked! ${Doors[doorPos].description}`);
        return;
      } else {
        row = targetRow; col = targetCol;
        PlayerPos = [row,col];
        await afterMoveReport(row,col);
        return;
      }
    } else {
      row = targetRow; col = targetCol;
      PlayerPos = [row,col];
      await afterMoveReport(row,col);
      return;
    }
  } else {
    print("Theres a wall in the way!");
  }
}

async function mainGame(){
  print("West side of the maze");
  print("There is a lonely letter left on the ground");

  while(true){
    stepCount += 1;

    if(PlayerHealth === 0){
      print("You have lost all of your health and died! Game Over!");
      lost += 1;
      break;
    }

    if(PlayerPos[0] === 10 && PlayerPos[1] === 9){
      print("Would you like to climb out of the maze or explore some more?");
      const ans = (await input("")).toLowerCase().trim();
      if(ans === "climb"){
        break;
      } else {
        print("Have fun and make sure to not die!");
      }
    }

    const command = (await input("")).toLowerCase().trim();

    if(command === "side"){
      const atEntrance = (PlayerPos[0]===0&&PlayerPos[1]===10) || (PlayerPos[0]===19&&PlayerPos[1]===4) ||
                          (PlayerPos[0]===9&&PlayerPos[1]===19) || (PlayerPos[0]===5&&PlayerPos[1]===0);
      if(atEntrance){
        print("Which side?");
        const dir = (await input("")).toLowerCase().trim();
        if(dir === "north" || dir === "n"){
          row=0; col=10; PlayerPos=[row,col]; VisitedRooms.add(key(row,col));
          print("North Side of the maze");
          print("You are at the north entrance of the maze, there is a wall to the west and east of you with a path going south");
        } else if(dir === "south" || dir === "s"){
          row=19; col=4; PlayerPos=[row,col]; VisitedRooms.add(key(row,col));
          print("South Side of the maze");
          print("You are at the south entrance of the maze, there is a wall to the west and east of you with a path going north");
        } else if(dir === "east" || dir === "e"){
          row=9; col=19; PlayerPos=[row,col]; VisitedRooms.add(key(row,col));
          print("East Side of the maze");
          print("You are at the east entrance of the maze, there is a wall to the north and south of you with a path going west");
        } else if(dir === "west" || dir === "w"){
          row=5; col=0; PlayerPos=[row,col]; VisitedRooms.add(key(row,col));
          print("West Side of the maze");
          print("You are at the west entrance of the maze, there is a wall to the north and south of you with a path going west");
        } else {
          print("What does", dir, "even mean?");
        }
      } else {
        print("You cant go to the side as you are inside the maze!");
      }
    }

    else if(command === "go"){
      print("Youll have to say which compass direction to go in");
      const dir = (await input("")).toLowerCase().trim();
      if(dir === "n" || dir === "north") await tryMove(-1,0);
      else if(dir === "s" || dir === "south") await tryMove(1,0);
      else if(dir === "e" || dir === "east") await tryMove(0,1);
      else if(dir === "w" || dir === "west") await tryMove(0,-1);
      else print("Not a valid direction, choose either north, east, south or west");
    }

    else if(command === "look"){
      print("Look at what?");
      const target = (await input("")).toLowerCase().trim();
      if(target === "health" || target === "h"){
        print("You have: ", PlayerHealth, "health");
      } else if(target === "inventory" || target === "i"){
        if(PlayerInventory.length){
          const w = getInventoryWeight();
          print(`You are carrying (${w}/${MAX_WEIGHT} weight):`);
          print(PlayerInventory.join(", "));
        } else {
          print("You are not carrying anything");
        }
      } else if(target === "room"){
        const pos = key(row,col);
        const adjDoors = getAdjacentDoors(row,col);
        for(const [direction, dr, dc] of adjDoors){
          const doorPos = key(dr,dc);
          if(doorPos in Doors){
            print(Doors[doorPos].locked ? `There is a locked door ${direction} to you` : `There is an unlocked door ${direction} to you`);
          } else {
            print(`There is a door ${direction} to you`);
          }
        }
        const adjNpcs = getAdjacentNPCs(row,col);
        for(const [direction, nr, nc] of adjNpcs){
          const npc = NPCs[key(nr,nc)];
          print(`There is a ${npc.description} ${direction} to you`);
        }
        const adjEnemies = getAdjacentEnemies(row,col);
        for(const [direction, er, ec] of adjEnemies){
          const enemy = enemies[key(er,ec)];
          print(`There is a ${enemy.name} ${direction} to you`);
        }
        if(pos in RoomItems && RoomItems[pos].length){
          print("You see:", RoomItems[pos].join(", "));
        } else {
          print("There are no useful items here");
        }
      } else {
        print("Thats not something that you can see");
      }
    }

    else if(command === "pick up"){
      print("What do you want to pick up?");
      const target = (await input("")).toLowerCase().trim();
      const pos = key(row,col);
      if(pos in RoomItems && RoomItems[pos].includes(target)){
        const item = target;
        const itemWeight = (Items[item] && "weight" in Items[item]) ? Items[item].weight : 1;
        const currentWeight = getInventoryWeight();
        if(currentWeight + itemWeight > MAX_WEIGHT){
          print(`That ${item} weighs ${itemWeight}. You're carrying ${currentWeight}/${MAX_WEIGHT} weight.`);
          print("You can't carry any more!");
        } else if(Items[item].grabbable){
          RoomItems[pos].splice(RoomItems[pos].indexOf(item),1);
          PlayerInventory.push(item);
          print(`You picked up the ${item} (weight: ${itemWeight})`);
          print(`Total weight: ${getInventoryWeight()}/${MAX_WEIGHT}`);
          if(RoomItems[pos].length === 0) delete RoomItems[pos];
        } else {
          print(`You can't pick up the ${item}!`);
        }
      } else {
        print(`There is no ${target} here!`);
      }
    }

    else if(command === "pick up all"){
      const pos = key(row,col);
      if(!(pos in RoomItems) || RoomItems[pos].length === 0){
        print("There's nothing here to pick up!");
      } else {
        const picked = [];
        const left = [];
        let currentWeight = getInventoryWeight();
        for(const item of RoomItems[pos].slice()){
          if(!Items[item].grabbable){
            left.push(item);
            print(`You can't pick up the ${item}!`);
            continue;
          }
          const w = (Items[item] && "weight" in Items[item]) ? Items[item].weight : 1;
          if(currentWeight + w <= MAX_WEIGHT){
            PlayerInventory.push(item);
            picked.push(item);
            RoomItems[pos].splice(RoomItems[pos].indexOf(item),1);
            currentWeight += w;
          } else {
            left.push(item);
          }
        }
        if(picked.length){
          print(`You picked up: ${picked.join(", ")}`);
          print(`Current weight: ${currentWeight}/${MAX_WEIGHT}`);
        }
        if(left.length){
          print(`Couldn't carry: ${left.join(", ")}`);
        }
        if(RoomItems[pos].length === 0) delete RoomItems[pos];
      }
    }

    else if(command === "drop all"){
      if(PlayerInventory.length){
        const dropped = PlayerInventory.slice();
        PlayerInventory.length = 0;
        const pos = key(row,col);
        if(!(pos in RoomItems)) RoomItems[pos] = [];
        RoomItems[pos].push(...dropped);
        print(`You dropped: ${dropped.join(", ")}`);
        print("Your inventory is now empty.");
      } else {
        print("You have nothing to drop!");
      }
    }

    else if(command === "drop"){
      if(PlayerInventory.length){
        print("What do you want to drop? ");
        const target = (await input("")).toLowerCase().trim();
        if(PlayerInventory.includes(target)){
          PlayerInventory.splice(PlayerInventory.indexOf(target),1);
          const pos = key(row,col);
          if(!(pos in RoomItems)) RoomItems[pos] = [];
          RoomItems[pos].push(target);
          print(`You dropped the ${target}`);
        } else {
          print(`You don't have a ${target}!`);
        }
      } else {
        print("You have nothing to drop!");
      }
    }

    else if(command === "read"){
      print("What do you want to read? ");
      const target = (await input("")).toLowerCase().trim();
      if(PlayerInventory.includes(target)){
        if(Items[target] && Items[target].readable){
          print(`"${Items[target].text}"`);
        } else {
          print(`You can't read the ${target}!`);
        }
      } else {
        const pos = key(row,col);
        if(pos in RoomItems && RoomItems[pos].includes(target)){
          if(Items[target].readable){
            print(`You read the ${target}:`);
            print(`"${Items[target].text}"`);
          } else {
            print(`You can't read the ${target}!`);
          }
        } else {
          print(`There is no ${target} to read!`);
        }
      }
    }

    else if(command === "inspect"){
      print("What do you want to inspect? ");
      const target = (await input("")).toLowerCase().trim();
      if(PlayerInventory.includes(target)){
        print(Items[target].description);
      } else {
        const pos = key(row,col);
        if(pos in RoomItems && RoomItems[pos].includes(target)){
          print(Items[target].description);
        } else {
          print(`There is no ${target} to inspect!`);
        }
      }
    }

    else if(command === "fight"){
      print("Are you sure you want to fight?");
      const ans = (await input("")).toLowerCase().trim();
      if(ans === "yes"){
        const nearby = getAdjacentEnemies(row,col);
        if(nearby.length){
          const [,er,ec] = nearby[0];
          const enemy = enemies[key(er,ec)];
          await handleEnemyInteraction(enemy, er, ec);
        } else {
          print("There's no one here to fight.");
        }
      } else if(ans === "no"){
        print("Wasting my time honestly");
      } else {
        print("Please answer with a yes or no");
      }
    }

    else if(command === "use"){
      print("What do you want to use? ");
      const target = (await input("")).toLowerCase().trim();
      if(PlayerInventory.includes(target)){
        if(target === "bread"){
          PlayerHealth = Math.min(100, PlayerHealth+30);
          PlayerInventory.splice(PlayerInventory.indexOf("bread"),1);
          print("You just gained 30 health, you now have", PlayerHealth, "health");
        } else if(target === "bandage"){
          PlayerHealth = Math.min(100, PlayerHealth+50);
          PlayerInventory.splice(PlayerInventory.indexOf("bandage"),1);
          print("You just gained 50 health, you now have", PlayerHealth, "health");
        } else if(target === "cheese"){
          PlayerHealth = Math.min(100, PlayerHealth+20);
          PlayerInventory.splice(PlayerInventory.indexOf("cheese"),1);
          print("You just gained 20 health, you now have", PlayerHealth, "health");
        } else if(target === "gruel"){
          PlayerHealth = Math.min(100, PlayerHealth+10);
          PlayerInventory.splice(PlayerInventory.indexOf("gruel"),1);
          print("You just gained 10 health, you now have", PlayerHealth, "health");
        } else if(["brass key","copper key","iron key","gold key"].includes(target)){
          const adjDoors = getAdjacentDoors(row,col);
          if(adjDoors.length){
            let unlockedAny = false;
            for(const [direction, dr, dc] of adjDoors){
              const doorPos = key(dr,dc);
              if(doorPos in Doors && Doors[doorPos].locked){
                if(Items[target].opens === Doors[doorPos].key_needed){
                  Doors[doorPos].locked = false;
                  unlockedAny = true;
                  if(target === "iron key" && dr===17 && dc===14){
                    NPCs[key(17,14)].free = true;
                    print("You unlocked the prison door");
                  } else {
                    print(`You unlock the door to the ${direction} with your key!`);
                  }
                }
              }
            }
            if(!unlockedAny) print("None of the adjacent doors can be unlocked with this key.");
          } else {
            print("There are no doors nearby to use the key on.");
          }
        } else {
          print(`You can't use the ${target} right now`);
        }
      } else {
        print(`You don't have a ${target}!`);
      }
    }

    else if(command === "talk"){
      const nearby = getAdjacentNPCs(row,col);
      if(nearby.length){
        const [,nr,nc] = nearby[0];
        const npc = NPCs[key(nr,nc)];
        if(npc.type === "riddler"){
          await handleNpcInteraction(npc, nr, nc);
        } else if(npc.type === "prisoner"){
          if(!npc.free){
            if(!prisonerDialogueDone){
              prisonerDialogueDone = true;
              await prisonerDialogue();
            } else {
              await typewriter("William: Have you found the key?");
              print("1 - Yes");
              print("2 - No");
              const choice = await askNumber([1,2]);
              if(choice === 2){
                await typewriter("William: Well take your time, im not going anywhere");
              } else {
                await typewriter("William: Well then get me out here!");
              }
            }
          } else {
            if(!prisonerDialogueDone2){
              prisonerDialogueDone2 = true;
              await prisonerDialogue2();
            } else {
              await typewriter("William: Less talking, more escaping please");
            }
          }
        } else if(npc.type === "shop"){
          const currentShop = shop[key(nr,nc)];
          if(currentShop){
            await handleShopInteraction(currentShop);
          } else {
            print(`${npc.name}: "..."`);
          }
        } else {
          print(`${npc.name}: "..."`);
        }
      } else {
        print("There's no one here to talk to.");
      }
    }

    else if(command === "give"){
      if(prisonerDialogueDone2){
        print("What would you like to give William?");
        const target = (await input("")).toLowerCase().trim();
        if(PlayerInventory.includes(target)){
          const validWeapons = ["mace","sword","spear","rusty dagger","rock"];
          if(validWeapons.includes(target)){
            if(williamWeapon !== null){
              PlayerInventory.push(williamWeapon);
              print(`William gives you back the ${williamWeapon}`);
              williamMulti = 1.0;
            }
            PlayerInventory.splice(PlayerInventory.indexOf(target),1);
            williamWeapon = target;
            if(target === "mace"){ williamMulti = 2.0; print("You gave William your mace! He will now do 2.0x damage!"); }
            else if(target === "sword"){ williamMulti = 1.8; print("You gave William your sword! He will now do 1.8x damage!"); }
            else if(target === "spear"){ williamMulti = 1.6; print("You gave William your spear! He will now do 1.6x damage!"); }
            else if(target === "rusty dagger"){ williamMulti = 1.4; print("You gave William your rusty dagger! He will now do 1.4x damage!"); }
            else if(target === "rock"){ williamMulti = 1.2; print("You gave William your rock! He will now do 1.2x damage!"); }
          } else {
            print(`You can't give the ${target} to William`);
          }
        } else {
          print(`You don't have a ${target}`);
        }
      } else {
        print("There's no one here to give anything to");
      }
    }

    else if(command === "take"){
      if(prisonerDialogueDone2){
        if(williamWeapon !== null){
          PlayerInventory.push(williamWeapon);
          print(`William gives you back the ${williamWeapon}.`);
          williamWeapon = null;
          williamMulti = 1.0;
        } else {
          print("William doesn't have any weapon to give back.");
        }
      } else {
        print("There's no one here to take from.");
      }
    }

    else if(command === "info"){
      print(`
These are the commands that exist in the game, USE THEM and please make sure to check your spelling
    side - This will let you switch to a different side of the maze (only works at the entrances)
    go - This will allow you to move around the maze in 4 directions (north,east,south,west)
    look - This will allow you to look at either your health, inventory or the room you are in
    pick up - self explanatory, it lets you pick stuff up and hold it in your inventory
    pick up all - Works after the 'pick up' command and allows you to pick up all items avaliable to you
    drop - Literally the opposite of pick up
    drop all - Allows you to drop everything in your inventory
    read - lets you read whatver you have in your inventory
    inspect - This will describe an item in your inventory of choosing (this is not the same as read)
    use - This will allow you to use the item of choosing from your inventory
    talk - Allows you to talk to NPCs near you
    fight - Allows you to fight enemies near you
    cheats - This will give you invincibility, all of the items to beat the game and prints you a map of the whole maze
Top tips:
    Whenever you use an item, make sure you spell it EXACTLY the same as when you see it

    The direction commands are shortened to the first letter, so;
        n - north
        s - south
        e - east
        w - west
    This also applies to;
        i - inventory
        t - template
        h - health
        `);
    }

    else if(command === "help"){
      print(`
To win, you have to enter the maze and find the centre to escape through the ladder to the surface of the earth
You have to make sure you are healthy, have good weapons and items that help you to kill the final boss in the centre
It is highly recommended to keep track of what the maze looks like so you can backtrack and go into different areas
(type "template" for the template of what the maze looks lke or "cheats" for invincibility, all of the items to beat the game and a map of the whole maze)`);
    }

    else if(command === "cheats"){
      print("You really thought i was going to give you all that? LOOOOOL Nice try");
    }

    else if(command === "quit"){
      print("Are you sure you want to quit?");
      const ans = (await input("")).toLowerCase().trim();
      if(ans === "yes"){
        print("GoodBye! Hope you had fun!");
        return;
      } else if(ans === "no"){
        print("Then why ask? Wasting my damn time");
      } else {
        print("Please answer with a yes or no");
      }
    }

    else if(command === "swear"){
      print(randint(1,2) === 1 ? "F*ck" : "Sh*t");
    }

    else if(command === "hello"){ print("Good day."); }
    else if(command === "what"){ print("What do you want to what is?"); }
    else if(command === "where"){ print("Where do you want to where is?"); }
    else if(command === "time"){
      const elapsed = (Date.now() - startTime)/1000;
      const minutes = Math.floor(elapsed/60);
      const seconds = Math.floor(elapsed%60);
      if(minutes === 0) print(`You have been playing for ${seconds} seconds too long`);
      else print(`You have been playing for ${minutes} minutes and ${seconds} seconds too long`);
    }
    else if(command === "shout" || command === "scream" || command === "yell"){
      print("AAAARRRRRRRGGGGGHHHHhhhhh");
    }
    else if(command === ""){
      print("I beg your pardon?");
    }
    else {
      print("Thats not a verb i recognise");
    }
  }

  if(lost === 1){
    await sleep(1500);
    await typewriter("Oh dear, you died ");
    await sleep(500);
    await typewriter("It happens to the best of us! ");
    await typewriter("All it takes is a retry and eventually youll make it");
    await typewriter("Here are some stats of your journey");
    print("" + "=".repeat(64));
    print("You took", stepCount, "steps");
    const elapsed = (Date.now() - startTime)/1000;
    const minutes = Math.floor(elapsed/60);
    const seconds = Math.floor(elapsed%60);
    await sleep(500);
    print(`You wasted ${minutes} minutes and ${seconds} seconds`);
    print("Would you like to play again?");
    const again = await input("");
    if(again.toLowerCase().trim() === "yes"){
      resetAndRestart();
    } else {
      print("Hope you had fun!");
    }
  } else {
    await typewriter("Wow you made it! Well done traveller");
    await sleep(1500);
    await typewriter("Here are some stats of your journey");
    print("" + "=".repeat(64));
    print("It took you", stepCount, "steps to complete your journey");
    const elapsed = (Date.now() - startTime)/1000;
    const minutes = Math.floor(elapsed/60);
    const seconds = Math.floor(elapsed%60);
    print(`and ${minutes} minutes and ${seconds} seconds to complete the game!`);
    await sleep(1500);
    await typewriter("You now step and see the world for the first time in 7 years..");
  }
}

function resetAndRestart(){
  location.reload();
}

mainGame().catch(err=>{
  sys("An error occurred: " + err.message);
  console.error(err);
});

})();
</script>
